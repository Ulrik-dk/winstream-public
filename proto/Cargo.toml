[package]
name = "proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wire protocol shared by server and client"

[features]
# Opus encoder/decoder over the system libopus (both machines have it).
opus = ["dep:opusic-sys"]
# Auth file, certificate pinning and connecting (server and client).
net = ["dep:anyhow", "dep:quinn", "dep:rustls", "dep:ring", "dep:tokio"]

[dependencies]
# Raw libopus bindings, without the bundled build (it needs CMake): links the
# system libopus.
opusic-sys = { version = "0.7", default-features = false, optional = true }
anyhow = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
tokio = { workspace = true, optional = true }
